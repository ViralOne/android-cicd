version: 2.1

commands:
  install-maestro:
    steps:
      - run:
          name: Install Maestro
          command: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            echo 'export PATH="$PATH:$HOME/.maestro/bin"' >> $BASH_ENV

  setup-avd:
    steps:
      - run:
          name: Setup AVD
          command: |
            echo "no" | sdkmanager --install "system-images;android-33;google_apis;x86"
            echo "no" | avdmanager create avd -n test_avd -k "system-images;android-33;google_apis;x86" --force
            nohup emulator -avd test_avd -no-window -no-audio -gpu swiftshader_indirect &

  run-maestro:
    steps:
      - run:
          name: Run checks & tests
          command: ./scripts/execute_test.sh

jobs:
  run_test:
    docker:
      - image: cimg/android:2024.11
    steps:
      - checkout
      - install-maestro
      - setup-avd
      - run-maestro

workflows:
  test:
    jobs:
      - run_test
