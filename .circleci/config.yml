version: 2.1
 
commands:
  install-maestro:
    steps:
      - run:
          name: Install Maestro
          command: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            echo 'export PATH="$PATH:$HOME/.maestro/bin"' >> $BASH_ENV

  run-maestro:
    steps:
      - run:
          name: Run checks & tests
          command: ./scripts/execute_test.sh

jobs:
  run_test:
    docker:
      - image: cimg/android:2024.11
    steps:
      - checkout
      - install-maestro
      - run-maestro
workflows:
  test:
    jobs:
      - run_test
